function actionView(){let t=task(),spec=jobSpec();if(!spec)return `<h2>${esc(t.name)}</h2><div class="intro">${esc(t.action.prompt)}</div><button class="btn" onclick="completeTask()">확인 후 계속</button>`;
let chapterLabels=['접수 시스템','간호정보조사지','입원 초진기록','야간 호출 기록','회진 경과 기록','재활치료 관찰지','퇴원 교육 기록','퇴원 수속 시스템'];return `<div class="eyebrow">${esc(chapterLabels[state.chapter])} · 업무 처리</div><h2>${esc(spec.label)}</h2><div class="source"><span class="sourcecap">확인한 정보 / 필요 업무</span>${esc(spec.source)}</div><div class="jobpanel">${workflowControls(spec)}</div>${spec.hint?`<div class="notice">${esc(spec.hint)}</div>`:""}<p id="joberror" class="joberror" role="alert"></p><div class="foot"><button class="ghost" onclick="back()">← 대화로 돌아가기</button><button class="btn" onclick="execute()">${state.chapter===7?'수속 기록 저장':'기록 저장 · 다음'}</button></div>`}
function execute(){let spec=jobSpec();if(!spec){completeTask();return}let v=state.form||{},ok=true;switch(spec.type){case 'identity':ok=spec.fields.every(([l,x],i)=>(v[i]||'').replace(/\s/g,'')===x.replace(/\s/g,''));break;case 'record':case 'observation':ok=spec.fields.every(([l,opts,x],i)=>v[i]===x);break;case 'note':ok=spec.fields.every((_,i)=>v[i]===true)&&String(v.note||'').trim().length>0;break;case 'contact':ok=v.confirmed===true;break;case 'payment':ok=v.payer===0||v.payer===1;if(ok){save.payer=v.payer===0?'bio':'jeongyo';persist()}break;default:ok=spec.fields.every((_,i)=>v[i]===true)}if(!ok){let e=document.getElementById('joberror');if(e)e.textContent='확인한 정보와 입력 내용이 일치하는지 검토하거나, 남은 항목을 완료해 주세요.';return}completeTask()}
function completeTask(){let t=task();let seen=save.seen[state.chapter]||[];if(!seen.includes(t.id))seen.push(t.id);save.seen[state.chapter]=seen;if(t.archive&&!save.found.includes(t.archive))save.found.push(t.archive);persist();state.lastReward={chapter:state.chapter,id:t.id};go({phase:'tasks',task:null,line:0})}
function speech(lines){let idx=state.line,[speaker,text]=lines[Math.min(idx,lines.length-1)];let cls=speaker==='비오'?'companion':speaker==='정요'?'patient':speaker==='서술'?'narration':'';return `<div class="dialogstage"><div class="speech ${cls}" aria-live="polite">${speaker==='서술'?'':`<div class="speaker">${esc(speaker)}</div>`}<div class="words">${esc(text)}</div></div><div class="counter">${idx+1} / ${lines.length}</div></div>`}
function dialogueView(){let t=task(),lines=t.lines,atEnd=state.line>=lines.length-1;return `<div class="eyebrow">${esc(t.action.heading)} · 진행 중</div><h2>${esc(t.name)}</h2>${speech(lines)}<div class="talkbuttons"><button class="ghost" onclick="previousLine()">← 이전</button><button class="btn" onclick="nextLine()">${atEnd?(jobSpec()?'업무 처리하기 →':'장면 마치기 →'):'계속 ›'}</button></div>`}
function previousLine(){if(state.line>0){state.line--;let y=window.scrollY;draw();restoreScroll(y);return}back()}
function nextLine(){let t=task();if(state.line<t.lines.length-1){state.line++;let y=window.scrollY;draw();restoreScroll(y);return}if(jobSpec())go({phase:'action',line:0,selection:[],input:'',form:{}});else completeTask()}
function startOutro(){if(doneTasks())go({phase:'outro',line:0})}
function outroView(){let c=chapters[state.chapter],lines=c.outro,atEnd=state.line>=lines.length-1;return `<div class="eyebrow">END OF SHIFT · ${esc(c.time)}</div><h2>근무를 마치며</h2>${speech(lines)}<div class="talkbuttons"><button class="ghost" onclick="previousOutro()">← 이전</button><button class="btn" onclick="nextOutro()">${atEnd?'근무 완료 →':'계속 ›'}</button></div>`}
function previousOutro(){if(state.line>0){state.line--;let y=window.scrollY;draw();restoreScroll(y)}else back()}
function nextOutro(){let lines=chapters[state.chapter].outro;if(state.line<lines.length-1){state.line++;let y=window.scrollY;draw();restoreScroll(y)}else finishChapter()}
function finishChapter(){if(!save.completed.includes(state.chapter))save.completed.push(state.chapter);persist();go({phase:'finished'})}
function finalEnding(){return `<section class="finalending"><div class="eyebrow">THE END · 퇴원 후</div><h2>같이 쉬는 날</h2><p>집에 돌아온 정요가 외투를 벗으려다 잠깐 멈춘다. 비오가 말없이 다가와 오른쪽 소매를 조심히 잡아 준다.</p><p>“나 혼자 할 수 있는데.”</p><p>“알아.”</p><p>그렇게 말하면서도 비오는 소매를 끝까지 벗겨 준다. 정요는 잠시 그를 바라보다가, 멀쩡한 왼손으로 비오의 손을 잡는다.</p><p>“오늘은 피아노 안 쳐?”</p><p>“응. 오늘은 너랑 있을 거야.”</p><p>정요가 웃는다. 아무도 박자를 세지 않는 오후가, 두 사람에게는 오래간만이다.</p><div class="endmark">FIN.</div></section>`}
function showFinalEnding(){let el=document.getElementById('ending-slot');if(el){el.innerHTML=finalEnding();el.scrollIntoView({behavior:'smooth',block:'start'})}}
function chapterView(){let c=chapters[state.chapter],body='';if(state.phase==='intro')body=`<div class="eyebrow">${esc(c.role)} · ${esc(c.time)}</div><h2>${esc(c.title)}</h2><div class="intro">${esc(c.intro)}</div><div class="foot"><button class="btn" onclick="go({phase:'tasks'})">근무 시작하기 →</button><button class="ghost" onclick="back()">← 이전 화면</button></div>`;
else if(state.phase==='tasks')body=taskList();else if(state.phase==='action')body=actionView();else if(state.phase==='dialog')body=dialogueView();else if(state.phase==='outro')body=outroView();else if(state.phase==='finished')body=`<div class="end"><div style="font-size:48px;color:var(--accent)">✓</div><div class="eyebrow">CHAPTER ${state.chapter+1} COMPLETE</div><h2>${esc(c.title)}</h2>${shiftSummary()}${state.chapter===7?'<div class="endingprompt"><p>두 사람의 2박 3일이 끝났습니다.</p><button class="btn" onclick="showFinalEnding()">마지막 이야기 읽기 →</button></div><div id="ending-slot"></div>':''}<div class="foot" style="justify-content:center"><button class="btn" onclick="${state.chapter===7?'home()':`openChapter(${state.chapter+1})`}">${state.chapter===7?'근무 일정으로':'다음 챕터 →'}</button></div></div>`;return layout(body)}
function homeView(){return `<section class="hero"><div class="eyebrow">INTERACTIVE HOSPITAL STORY · 8 CHAPTERS</div><h1>입원환자의무기록_최정요(M/31)</h1><p>환자 최정요, 동행인 강비오. 병원에서 보내는 2박 3일.<br>병원의 다양한 의료진이 되어, 직접 업무를 수행하세요.</p><button class="btn" onclick="openChapter(${chapters.findIndex((_,i)=>!save.completed.includes(i))<0?0:chapters.findIndex((_,i)=>!save.completed.includes(i))})">${save.completed.length?'이어하기':'입원 접수 시작'} →</button><p class="small">완료 ${save.completed.length}/8 · 발견 ${save.found.length}/${archive.length} · 자동 저장</p></section><h2 class="section">근무 일정표</h2><div class="grid">${chapters.map((c,i)=>`<button class="chapter" onclick="openChapter(${i})"><span class="tag">CH. ${String(i+1).padStart(2,'0')} · ${esc(c.time)}</span><strong>${esc(c.title)}</strong><span class="small">${esc(c.role)} · ${esc(c.place)}</span><span class="status">${save.completed.includes(i)?'✓ 완료':(save.seen[i]||[]).length?'◌ 진행 중':'○ 시작 전'}</span></button>`).join('')}</div><p class="notice">챕터는 자유롭게 선택할 수 있습니다. 선택 이벤트는 결말에 영향을 주지 않습니다.</p>`}
function archiveView(){return `<div class="panel"><div class="eyebrow">COLLECTED TRACES</div><h2>발견한 흔적들</h2><p class="small">${save.found.length}/${archive.length}개 발견</p><div class="grid">${archive.map(a=>`<div class="archive ${save.found.includes(a.id)?'':'locked'}"><div class="tag">${save.found.includes(a.id)?esc(a.where):'아직 발견하지 못함'}</div><strong>${save.found.includes(a.id)?esc(a.name):'???'}</strong><p class="small">${save.found.includes(a.id)?esc(a.desc):'선택 이벤트를 찾아보세요.'}</p></div>`).join('')}</div><div class="foot"><button class="ghost" onclick="back()">← 이전 화면</button></div></div>`}
function infoView(){return `<div class="panel"><div class="eyebrow">HOW TO PLAY</div><h2>플레이 안내</h2><p>환자와 동행인의 대화를 한 줄씩 듣고, 이후 담당 직원으로서 신원 확인, 문진 결과 기록, 서류 처리 등의 업무를 수행합니다. 환자나 동행인의 입장이 되어 선택하지 않습니다.</p><p>대화는 '계속' 버튼으로 진행하고, '이전' 버튼으로 한 줄씩 돌아갈 수 있습니다. 화면을 벗어났다가 돌아오면 이전 스크롤 위치가 복원됩니다.</p><div class="notice">최정요는 본인의 치료와 일정을 직접 결정합니다. 강비오는 환자가 지정한 동행인이자 비상 연락처입니다.</div><p>본편은 총 8개 챕터이며, 퇴원 수속을 마치면 이야기가 끝납니다.</p><div class="foot"><button class="ghost" onclick="back()">← 이전 화면</button><button class="ghost" onclick="if(confirm('이 버전의 진행 기록을 초기화할까요?')){save={completed:[],seen:{},found:[],payer:'bio'};persist();stack=[];state={view:'home',chapter:0,phase:'intro',task:null,line:0,selection:[],input:''};draw();window.scrollTo(0,0)}">기록 초기화</button></div></div>`}
function draw(){root.innerHTML=renderTop()+(state.view==='home'?homeView():state.view==='chapter'?chapterView():state.view==='archive'?archiveView():infoView())+`<footer class="footer">《입원환자의무기록_최정요(M/31)》 · 독립형 인터랙티브 스토리 · 극적 연출을 위한 허구</footer>`}
window.addEventListener('popstate',()=>back());
try{draw();}catch(e){document.getElementById('root').innerHTML='<section class="hero"><h1>게임 초기화 오류</h1><pre style="white-space:pre-wrap">'+String(e.message).replace(/[<>]/g,'')+'</pre></section>';}

</script></body></html>
